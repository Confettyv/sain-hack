<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sain · эксперты по сну</title>
<meta name="description" content="Вопрос о сне трём экспертам: ответ в стиле эксперта со ссылкой на научную статью.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Sain · эксперты по сну">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M20 4a12 12 0 1 0 8 20A10 10 0 0 1 20 4z' fill='%234f46e5'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #ffffff; --soft: #f4f4f7; --text: #18181b; --muted: #6b6b76; --line: #e4e4ea;
  --accent: #4f46e5; --on-accent: #fff;
  --c-clinician: #2563eb; --c-biohacker: #047857; --c-nutritionist: #c2410c;
  --r: 16px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--font);
  display: flex; flex-direction: column; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 16px; }

header { position: sticky; top: 0; z-index: 2; background: rgba(255,255,255,.94);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header .wrap { padding-top: 12px; padding-bottom: 12px; }
h1 { margin: 0 0 10px; font-size: 17px; font-weight: 700; }
h1 span { color: var(--muted); font-weight: 400; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; font: inherit; font-size: 15px; min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
.hint { margin: 8px 0 0; color: var(--muted); font-size: 14px; min-height: 22px; }

.chat { flex: 1; }
.chat .wrap { display: grid; gap: 18px; padding-top: 20px; padding-bottom: 20px; }
.empty { color: var(--muted); text-align: center; padding: 40px 0 8px; }
.empty p { margin: 0 0 16px; }
.samples { display: grid; gap: 8px; justify-items: center; }
.sample { font: inherit; font-size: 15px; color: var(--text); background: var(--soft); border: 0;
  border-radius: 12px; padding: 10px 14px; min-height: 44px; cursor: pointer; text-align: left; max-width: 100%; }
.q { justify-self: end; max-width: 85%; margin: 0; padding: 10px 14px; background: var(--accent);
  color: var(--on-accent); border-radius: var(--r) var(--r) 4px var(--r); overflow-wrap: anywhere; }
.a { margin: 0; padding: 14px 16px; background: var(--soft); border-radius: 4px var(--r) var(--r) var(--r); min-width: 0; }
.who { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: var(--c, var(--accent)); }
.who::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tag { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); border: 1px solid var(--line);
  background: var(--bg); border-radius: 999px; padding: 1px 8px; }
.text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.src { margin: 10px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: inherit; }
.wait { color: var(--muted); margin: 0; }
.err { margin: 0; color: #b42318; font-size: 15px; }

footer { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
form { display: flex; gap: 8px; align-items: flex-end; padding-top: 10px; padding-bottom: 10px; }
textarea { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--soft); border: 1px solid transparent;
  border-radius: 22px; padding: 10px 16px; min-height: 44px; max-height: 160px; resize: none; }
textarea:focus { border-color: var(--line); background: var(--bg); }
.send { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent);
  color: var(--on-accent); display: grid; place-items: center; cursor: pointer; }
.send[disabled] { opacity: .45; cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .wait::after { content: "…"; animation: dots 1s steps(2) infinite; }
  @keyframes dots { 50% { opacity: 0; } }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Sain <span>эксперты по сну</span></h1>
    <div class="tabs" id="tabs" role="group" aria-label="Кому задать вопрос"></div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>
</header>

<main class="chat">
  <div class="wrap" id="log" aria-live="polite">
    <div class="empty" id="empty">
      <p>Задайте вопрос о сне. Ответ опирается на научную статью из базы.</p>
      <div class="samples" id="samples"></div>
    </div>
  </div>
</main>

<footer>
  <form class="wrap" id="form">
    <label class="sr" for="text">Вопрос</label>
    <textarea id="text" name="text" rows="1" maxlength="1000" placeholder="Ваш вопрос" required></textarea>
    <button class="send" type="submit" id="send" aria-label="Отправить">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const SHORT = { clinician: "Клиницист", biohacker: "Биохакер", nutritionist: "Нутрициолог" };
const SAMPLES = [
  "Пью кофе в пять вечера, это мешает уснуть?",
  "В спальне жарко. Это влияет на сон?",
  "Сколько мелатонина пить перед сном?",
];
const experts = {};
let current = "all";
let history = [];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (res.status === 429) throw new Error("лимит вопросов на сегодня исчерпан");
  if (!res.ok) throw new Error(data.error || `сервер ответил ${res.status}`);
  return data;
}
function select(id) {
  if (id !== current) history = [];
  current = id;
  for (const b of $("tabs").children) b.setAttribute("aria-pressed", String(b.dataset.id === id));
  $("hint").textContent = id === "all" ? "Один вопрос, три разных ответа" : (experts[id]?.tagline || "");
}
async function loadExperts() {
  try {
    const { experts: list } = await api("/experts");
    list.forEach((e) => (experts[e.expert_id] = e));
    $("tabs").replaceChildren(...["all", ...list.map((e) => e.expert_id)].map((id) => {
      const b = el("button", "tab", id === "all" ? "Все трое" : SHORT[id] || experts[id].name);
      b.type = "button";
      b.dataset.id = id;
      b.onclick = () => select(id);
      return b;
    }));
    select("all");
  } catch (err) {
    $("hint").textContent = `Эксперты не загрузились: ${err.message}. Обновите страницу.`;
  }
}
function answer(a, data) {
  const box = el("article", "a");
  box.style.setProperty("--c", `var(--c-${a.expert_id})`);
  const who = el("div", "who", experts[a.expert_id]?.name || a.expert_id);
  if (data.refused) who.append(el("span", "tag", "вне компетенции"));
  const c = data.citations[0] || {};
  const src = el("p", "src", `Источник: ${c.article_title || c.article_id}${c.year ? `, ${c.year}` : ""}`);
  if (c.doi) {
    const link = el("a", "", "DOI");
    link.href = `https://doi.org/${c.doi}`;
    link.target = "_blank";
    link.rel = "noopener";
    src.append(" · ", link);
  }
  box.append(who, el("p", "text", a.text), src);
  return box;
}
async function ask(text) {
  $("empty")?.remove();
  const log = $("log");
  const asked = current;
  log.append(el("p", "q", text));
  const wait = el("p", "wait", asked === "all" ? "Эксперты пишут" : "Эксперт пишет");
  log.append(wait);
  wait.scrollIntoView({ block: "end" });
  $("send").disabled = true;
  try {
    const data = await api("/ask", { expert_id: asked, text, history: asked === "all" ? [] : history });
    const list = data.answers || [{ expert_id: data.expert_id, text: data.text }];
    wait.replaceWith(...list.map((a) => answer(a, data)));
    if (asked !== "all") history.push({ role: "user", text }, { role: "assistant", text: list[0].text });
    $("text").value = "";
    grow();
  } catch (err) {
    wait.replaceWith(el("p", "err", `Ответа нет: ${err.message}. Вопрос остался в поле.`));
  } finally {
    $("send").disabled = false;
    log.lastElementChild.scrollIntoView({ block: "nearest" });
  }
}
function grow() {
  const t = $("text");
  t.style.height = "auto";
  t.style.height = `${Math.min(t.scrollHeight + 2, 160)}px`;
}
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) { $("text").focus(); return; }
  if (!$("send").disabled) ask(text);
});
$("text").addEventListener("input", grow);
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
for (const q of SAMPLES) {
  const b = el("button", "sample", q);
  b.type = "button";
  b.onclick = () => { $("text").value = q; grow(); $("text").focus(); };
  $("samples").append(b);
}
loadExperts();
</script>
</body>
</html>
