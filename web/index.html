<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SAIN · эксперты по сну</title>
<meta name="description" content="Вопрос о сне трём экспертам: ответ в стиле эксперта со ссылкой на научную статью.">
<meta name="robots" content="noindex">
<meta property="og:title" content="SAIN · эксперты по сну">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='58' fill='%230a0a0a'/%3E%3Cg fill='%23aedf0c'%3E%3Cg id='s'%3E%3Cellipse cx='78' cy='91' rx='21' ry='15'/%3E%3Cellipse cx='62' cy='129' rx='21' ry='17' transform='rotate(-25 62 129)'/%3E%3Cellipse cx='81' cy='164' rx='21' ry='15'/%3E%3Cpath d='M72 100q-2 8-6 14M66 143q2 8 8 12' fill='none' stroke='%23aedf0c' stroke-width='11' stroke-linecap='round'/%3E%3C/g%3E%3Cuse href='%23s' transform='matrix(-1 0 0 1 254 0)'/%3E%3Cellipse cx='127' cy='75' rx='21' ry='15'/%3E%3Cellipse cx='127' cy='181' rx='21' ry='15'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #ffffff; --soft: #f5f5f5; --text: #0a0a0a; --muted: #6b6b6b; --line: #e8e8e8;
  --accent: #0a0a0a; --on-accent: #fff; --lime: #aedf0c;
  --c-clinician: #2f6fde; --c-biohacker: #2f9a5a; --c-nutritionist: #e0712c;
  --ease: cubic-bezier(.2, .8, .2, 1); --t: .2s;
  --r: 20px; --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --lift: 0 0 0 1px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--text);
  font: 16px/1.6 var(--font); letter-spacing: -.005em; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; letter-spacing: inherit; cursor: pointer; touch-action: manipulation; }
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 16px; }

header { position: sticky; top: 0; z-index: 2; background: var(--bg); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .04em; line-height: 1.15; }
.brand small { display: block; font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.logo { flex: none; display: block; border-radius: 9px; }
.picker { position: relative; }
.pick { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 16px; border-radius: 999px;
  border: 0; box-shadow: var(--lift); background: var(--bg); color: var(--text); font-size: 15px; font-weight: 500; white-space: nowrap; }
.pick svg { color: var(--muted); }
@media (max-width: 374px) { .brand small { display: none; } }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
[data-id="all"] .dot, [data-id="all"] .who::before { background: var(--c-clinician); margin-right: 20px;
  box-shadow: 10px 0 var(--c-biohacker), 20px 0 var(--c-nutritionist); }
.menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 3; width: min(340px, calc(100vw - 32px));
  display: grid; gap: 2px; padding: 6px; background: var(--bg); border-radius: 18px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 12px 32px rgba(0, 0, 0, .1); transform-origin: top right; }
.menu[hidden] { display: none; }
.opt { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-size: 13px; }
.opt .who { margin: 0; font-size: 15px; }
.opt[aria-pressed="true"] { background: var(--soft); }

.chat { flex: 1; }
.chat .wrap { display: grid; gap: 16px; padding-top: 24px; padding-bottom: 24px; }
.empty { color: var(--muted); padding: 8px 0; display: grid; gap: 14px; }
.empty p { margin: 0; }
.empty h2 { margin: 0; color: var(--text); font-size: clamp(28px, 7vw, 40px); font-weight: 500; letter-spacing: -.035em; line-height: 1.1; }
.empty .label { margin-top: 10px; font-size: 13px; font-weight: 500; }
.cards, .samples { display: grid; gap: 8px; }
.card { display: grid; gap: 2px; text-align: left; padding: 14px 16px; border-radius: 16px;
  border: 0; box-shadow: var(--lift); background: var(--bg); color: var(--muted); font-size: 14px; }
.card .who { margin: 0; font-size: 15px; }
.say { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--c); color: var(--text); font-size: 14px; line-height: 1.45; }
.samples { display: flex; flex-wrap: wrap; }
.sample { font-size: 15px; color: var(--text); background: var(--soft); border: 0; border-radius: 22px;
  padding: 10px 16px; min-height: 44px; text-align: left; }
.q { justify-self: end; max-width: 85%; margin: 0; padding: 10px 16px; background: var(--soft);
  border-radius: var(--r) var(--r) 6px var(--r); overflow-wrap: anywhere; }
.a { margin: 0; padding: 16px 18px; background: var(--bg); border-radius: var(--r); box-shadow: var(--lift); min-width: 0; }
.who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text); }
.who::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); }
.tag { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 2px 10px; }
.text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.src { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: var(--text); display: inline-block; padding: 12px 6px; margin: -12px -6px; }
.more { margin-top: 4px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--text); font-size: 14px; font-weight: 500;
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.stage { margin: 0 0 12px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.bar { height: 10px; border-radius: 6px; background: var(--soft); }
.bar + .bar { margin-top: 8px; width: 70%; }
.err { display: grid; gap: 8px; justify-items: start; color: #b42318; font-size: 15px; }
.err p { margin: 0; }
.retry { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 500; }

footer { position: sticky; bottom: 0; background: linear-gradient(rgba(255, 255, 255, 0), var(--bg) 14px);
  padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
form { display: flex; gap: 8px; align-items: flex-end; padding-top: 14px; }
.box { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 8px; padding: 6px; background: var(--bg); border: 2px solid var(--accent); }
textarea { flex: 1; min-width: 0; font: inherit; color: var(--text); background: none; border: 0; outline: 0;
  padding: 10px 4px 10px 12px; min-height: 44px; max-height: 160px; resize: none; }
textarea:focus-visible { outline: 0; }
.send { flex: none; width: 44px; height: 44px; border-radius: 0; border: 0; background: var(--accent);
  color: var(--on-accent); display: grid; place-items: center; }
.send[disabled] { opacity: .3; cursor: default; }
@media (hover: hover) {
  .sample:hover { background: #ebebeb; }
  .pick:hover, .opt:hover { background: var(--soft); }
  .card:hover { box-shadow: 0 0 0 1px rgba(0, 0, 0, .1), 0 8px 24px rgba(0, 0, 0, .07); }
  .send:not([disabled]):hover, .retry:hover { background: #333; }
  .more:hover { text-decoration-color: currentColor; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  button, textarea { transition: background-color var(--t) var(--ease), color var(--t) var(--ease),
    opacity var(--t) var(--ease), transform var(--t) var(--ease); }
  button:not([disabled]):active { transform: scale(.96); transition-duration: .08s; }
  @media (hover: hover) { .card:not(:active):hover { transform: translateY(-2px); } }
  .pick svg { transition: transform var(--t) var(--ease); }
  .pick[aria-expanded="true"] svg { transform: rotate(180deg); }
  .menu:not([hidden]) { animation: drop .18s var(--ease) both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
  .dots i { animation: hop 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .bar { animation: glow 1.4s infinite ease-in-out; }
  .pending, .in { animation: rise .45s var(--ease) both; }
  .send[aria-busy="true"] { opacity: 1; }
  .send[aria-busy="true"] svg { display: none; }
  .send[aria-busy="true"]::after { content: ""; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes hop { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes glow { 50% { opacity: .45; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  @keyframes spin { to { transform: rotate(360deg); } }
}
</style>
</head>
<body>
<header id="head">
  <div class="wrap">
    <h1 class="brand">
      <svg class="logo" width="34" height="34" viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" rx="58" fill="#0a0a0a"/><g fill="#aedf0c"><g id="s"><ellipse cx="78" cy="91" rx="21" ry="15"/><ellipse cx="62" cy="129" rx="21" ry="17" transform="rotate(-25 62 129)"/><ellipse cx="81" cy="164" rx="21" ry="15"/><path d="M72 100q-2 8-6 14M66 143q2 8 8 12" fill="none" stroke="#aedf0c" stroke-width="11" stroke-linecap="round"/></g><use href="#s" transform="matrix(-1 0 0 1 254 0)"/><ellipse cx="127" cy="75" rx="21" ry="15"/><ellipse cx="127" cy="181" rx="21" ry="15"/></g></svg>
      <span>SAIN<small>эксперты по сну</small></span>
    </h1>
    <div class="picker" id="picker">
      <button class="pick" type="button" id="pick" aria-expanded="false" aria-controls="menu" disabled>
        <span class="sr">Кому задать вопрос: </span><span class="dot"></span><span id="pick-name">Все трое</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu" id="menu" hidden></div>
    </div>
  </div>
</header>

<main class="chat">
  <div class="wrap" id="log" aria-live="polite">
    <div class="empty" id="empty">
      <h2>Спросите о сне трёх экспертов</h2>
      <p>Каждый ответит по-своему и сошлётся на научную статью. Эксперты вымышленные, это не медицинская консультация.</p>
      <p class="label" id="sayLabel" hidden>Как каждый начнёт ответ на вопрос «Почему я просыпаюсь в 4 утра?»</p>
      <div class="cards" id="cards"></div>
      <p class="label">Или начните с примера</p>
      <div class="samples" id="samples"></div>
    </div>
  </div>
</main>

<footer>
  <form class="wrap" id="form">
    <label class="sr" for="text">Вопрос</label>
    <div class="box">
      <textarea id="text" name="text" rows="1" maxlength="1000" placeholder="Ваш вопрос" enterkeyhint="send" required></textarea>
      <button class="send" type="submit" id="send" aria-label="Отправить" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const SHORT = { clinician: "Клиницист", biohacker: "Биохакер", nutritionist: "Нутрициолог" };
const TO = { all: "всем троим", clinician: "клиницисту", biohacker: "биохакеру", nutritionist: "нутрициологу" };
const SAMPLES = [
  "Пью кофе в пять вечера, это мешает уснуть?",
  "В спальне жарко. Это влияет на сон?",
  "Тренируюсь вечером. Это мешает уснуть?",
];
const STAGES = [[1500, "ищет статью"], [4000, "пишет ответ"]];
const motion = matchMedia("(prefers-reduced-motion: no-preference)").matches;
const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
const STAND = "https://team01.hack.be-healthy.tech";
const mouse = matchMedia("(pointer: fine)").matches;
let base = "";
const experts = {};
let current = "all";
let history = [];
let article = "";
let failed = [];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
async function api(path, body) {
  let res;
  try {
    const init = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
    res = await fetch(base + path, { ...init, signal: AbortSignal.timeout(90000) });
  } catch (err) {
    throw new Error(err.name === "TimeoutError" ? "сервер не ответил вовремя" : "нет связи с сервером");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "сервер временно недоступен"), { status: res.status });
  return data;
}
function name(id) {
  return id === "all" ? "Все трое" : experts[id]?.name || id;
}
function menu(open) {
  $("pick").setAttribute("aria-expanded", String(open));
  $("menu").hidden = !open;
}
function select(id) {
  current = id;
  for (const b of $("menu").children) b.setAttribute("aria-pressed", String(b.dataset.id === id));
  $("pick").dataset.id = id;
  $("pick").style.setProperty("--c", `var(--c-${id})`);
  $("pick-name").textContent = SHORT[id] || name(id);
  $("text").placeholder = `Вопрос ${TO[id] || name(id)}`;
}
function pick(id) {
  select(id);
  if (mouse) $("text").focus();
}
async function loadExperts() {
  try {
    let list = await api("/experts").then((d) => d.experts).catch(() => null);
    if (!list) {
      base = STAND;
      list = (await api("/experts")).experts;
    }
    list.forEach((e) => (experts[e.expert_id] = e));
    $("menu").replaceChildren(...["all", ...list.map((e) => e.expert_id)].map((id) => {
      const b = el("button", "opt", id === "all" ? "Один вопрос, три разных ответа" : experts[id].tagline);
      b.type = "button";
      b.dataset.id = id;
      b.style.setProperty("--c", `var(--c-${id})`);
      b.prepend(el("span", "who", name(id)));
      b.onclick = () => {
        select(id);
        menu(false);
        $("pick").focus();
      };
      return b;
    }));
    $("pick").disabled = false;
    $("cards").replaceChildren(...list.map((e) => {
      const b = el("button", "card", e.tagline);
      b.type = "button";
      b.style.setProperty("--c", `var(--c-${e.expert_id})`);
      b.prepend(el("span", "who", e.name));
      if (e.sample) b.append(el("span", "say", `«${e.sample}»`));
      b.onclick = () => pick(e.expert_id);
      return b;
    }));
    $("sayLabel").hidden = !list.some((e) => e.sample);
    select("all");
    $("send").disabled = false;
  } catch (err) {
    $("cards").replaceChildren(el("p", "err", `Эксперты не загрузились: ${err.message}. Обновите страницу.`));
  }
}
function card(id) {
  const box = el("article", "a");
  box.style.setProperty("--c", `var(--c-${id})`);
  box.append(el("div", "who", name(id)));
  return box;
}
function pending(id) {
  const box = card(id);
  box.classList.add("pending");
  box.setAttribute("aria-hidden", "true");
  const stage = el("p", "stage", "читает вопрос");
  const dots = el("span", "dots");
  dots.append(el("i"), el("i"), el("i"));
  stage.append(dots);
  box.append(stage, el("div", "bar"), el("div", "bar"));
  return box;
}
function answer(a, data, asked) {
  const box = card(a.expert_id);
  if (motion) box.classList.add("in");
  if (data.refused) box.firstChild.append(el("span", "tag", "вне компетенции"));
  else if (data.demo || data.degraded) box.firstChild.append(el("span", "tag", "упрощённый ответ"));
  box.append(el("p", "text", a.text));
  const c = data.citations[0];
  if (c) box.append(source(c));
  if (asked === "all") {
    const more = el("button", "more", "Спросить дальше");
    more.type = "button";
    more.setAttribute("aria-label", `Продолжить разговор: ${name(a.expert_id)}`);
    more.onclick = () => pick(a.expert_id);
    box.append(more);
  }
  return box;
}
function source(c) {
  const where = [c.article_title || c.article_id, c.section_title && `раздел «${c.section_title}»`, c.year].filter(Boolean);
  const src = el("p", "src", `Источник: ${where.join(", ")}`);
  if (c.doi) {
    const link = el("a", "", "DOI");
    link.href = `https://doi.org/${c.doi}`;
    link.target = "_blank";
    link.rel = "noopener";
    src.append(" · ", link);
  }
  return src;
}
function busy(on) {
  $("send").disabled = on;
  $("send").setAttribute("aria-busy", String(on));
}
async function ask(text) {
  $("empty")?.remove();
  failed.forEach((n) => n.remove());
  failed = [];
  const asked = current;
  const q = el("p", "q", text);
  const slots = Object.fromEntries((asked === "all" ? Object.keys(experts) : [asked]).map((id) => [id, pending(id)]));
  $("log").append(q, ...Object.values(slots));
  q.scrollIntoView({ block: "start", behavior: motion ? "smooth" : "auto" });
  busy(true);
  const timers = STAGES.map(([ms, label]) => setTimeout(() => {
    for (const s of Object.values(slots)) s.querySelector(".stage").firstChild.textContent = label;
  }, ms));
  try {
    const sent = history.map((m) => (m.answers ? { role: "assistant", text: m.answers[asked] || Object.values(m.answers)[0] } : m));
    const body = { expert_id: asked, text, history: sent, article };
    const data = await api("/ask", body).catch(async (err) => {
      if (err.status !== 429) throw err;
      return { ...(await api("/ask", { ...body, fake: true })), demo: true };
    });
    const list = data.answers || [{ expert_id: data.expert_id, text: data.text }];
    history.push({ role: "user", text }, { answers: Object.fromEntries(list.map((a) => [a.expert_id, a.text])) });
    article = data.citations[0]?.article_id || "";
    for (const [i, a] of list.entries()) {
      if (i && motion) await sleep(400);
      slots[a.expert_id].replaceWith(answer(a, data, asked));
    }
  } catch (err) {
    Object.values(slots).forEach((s) => s.remove());
    const box = el("div", "err");
    const retry = el("button", "retry", "Повторить");
    retry.type = "button";
    retry.onclick = () => {
      if ($("send").disabled) return;
      if ($("text").value === text) $("text").value = "";
      grow();
      ask(text);
    };
    failed = [q, box];
    box.append(el("p", "", `Ответа нет: ${err.message}. Вопрос вернул в поле.`), retry);
    q.after(box);
    if (!$("text").value) $("text").value = text;
    grow();
  } finally {
    timers.forEach(clearTimeout);
    busy(false);
  }
}
function grow() {
  const t = $("text");
  const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 8;
  t.style.height = "auto";
  t.style.height = `${Math.min(t.scrollHeight + 2, 160)}px`;
  if (atBottom) scrollTo(0, document.documentElement.scrollHeight);
}
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if ($("send").disabled) return;
  if (!text) { $("text").focus(); return; }
  $("text").value = "";
  grow();
  ask(text);
});
$("text").addEventListener("input", grow);
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
for (const q of SAMPLES) {
  const b = el("button", "sample", q);
  b.type = "button";
  b.onclick = () => { $("text").value = q; grow(); if (mouse) $("text").focus(); };
  $("samples").append(b);
}
$("pick").onclick = () => menu($("menu").hidden);
document.addEventListener("click", (e) => {
