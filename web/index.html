<style>
:root {
  --bg: #ffffff; --soft: #f5f5f5; --text: #0a0a0a; --muted: #6b6b6b; --line: #e8e8e8;
  --accent: #0a0a0a; --on-accent: #fff; --lime: #aedf0c;
  --c-clinician: #2f6fde; --c-biohacker: #2f9a5a; --c-nutritionist: #e0712c;
  --ease: cubic-bezier(.2, .8, .2, 1); --t: .2s;
  --r: 20px; --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --lift: 0 0 0 1px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);
  --lift-hover: 0 0 0 1px rgba(0, 0, 0, .1), 0 8px 24px rgba(0, 0, 0, .07);
  --float: 0 0 0 1px rgba(0, 0, 0, .06), 0 12px 32px rgba(0, 0, 0, .1);
  --card: #ffffff; --hover: #ebebeb; --press: #333; --err: #b42318;
  --side-bg: #f7f7f7; --side: 0px;
}
:root[data-theme="dark"] {
  --bg: #17181b; --card: #1e1f23; --soft: #26272c; --text: #e4e2de; --muted: #9a9894; --line: #313237;
  --accent: #c9c7c2; --on-accent: #17181b; --hover: #2d2e33; --press: #b3b1ac; --err: #e58a80; --side-bg: #131417;
  --c-clinician: #7096d6; --c-biohacker: #62a67e; --c-nutritionist: #cf8a5f;
  --lift: 0 0 0 1px rgba(255, 255, 255, .06); --lift-hover: 0 0 0 1px rgba(255, 255, 255, .12);
  --float: 0 0 0 1px rgba(255, 255, 255, .08), 0 12px 32px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--text);
  font: 16px/1.6 var(--font); letter-spacing: -.005em; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  padding-left: var(--side); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; letter-spacing: inherit; cursor: pointer; touch-action: manipulation; }
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 16px; }

header { position: sticky; top: 0; z-index: 2; background: var(--bg); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; padding-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .04em; line-height: 1.15; }
.brand small { display: block; white-space: nowrap; font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.logo { flex: none; display: block; border-radius: 9px; }
.lead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.side { position: fixed; inset: 0 auto 0 0; z-index: 5; width: min(288px, 86vw); display: flex; flex-direction: column; gap: 14px;
  padding: 14px 12px calc(14px + env(safe-area-inset-bottom)); background: var(--side-bg); box-shadow: 1px 0 0 var(--line);
  transform: translateX(-100%); visibility: hidden; }
.side.open { transform: none; visibility: visible; box-shadow: var(--float); }
.side-top { display: flex; align-items: center; justify-content: space-between; padding-left: 8px; }
.side-brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
.side-brand img { border-radius: 8px; }
.plain { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: none; color: var(--muted); display: grid; place-items: center; }
.new { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border: 0; border-radius: 999px;
  background: var(--hover); color: var(--text); font-size: 16px; font-weight: 500; }
.list { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 2px; margin: 0 -4px; padding: 0 4px; }
.when { margin: 14px 0 4px; padding: 0 12px; font-size: 13px; font-weight: 500; color: var(--muted); }
.when:first-child { margin-top: 4px; }
.item { display: flex; align-items: center; border-radius: 12px; }
.item:has([aria-current="true"]) { background: var(--hover); }
.item .open { flex: 1; min-width: 0; min-height: 44px; padding: 0 4px 0 12px; border: 0; background: none; color: var(--text);
  font-size: 15px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.del { flex: none; width: 40px; height: 44px; border: 0; border-radius: 12px; background: none; color: var(--muted); display: none; place-items: center; }
.item:hover .del, .item:focus-within .del, .item:has([aria-current="true"]) .del { display: grid; }
.shade { position: fixed; inset: 0; z-index: 4; background: rgba(0, 0, 0, .32); }
.shade[hidden] { display: none; }
@media (min-width: 1000px) {
  :root { --side: 288px; }
  :root.folded { --side: 68px; }
  .side { width: var(--side); overflow: hidden; transform: none; visibility: visible; box-shadow: 1px 0 0 var(--line); }
  .folded .side-brand, .folded .list, .folded .new span { display: none; }
  .folded .side-top { justify-content: center; padding-left: 0; }
  .folded .new { width: 44px; min-height: 44px; padding: 0; }
  button.open-side, :root:not(.folded) .lead .brand, .shade { display: none; }
}
.picker { position: relative; }
.tools { display: flex; align-items: center; gap: 8px; }
.theme, .icon { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; box-shadow: var(--lift); background: var(--card);
  color: var(--text); display: grid; place-items: center; }
.theme .sun, [data-dark] .theme .moon { display: none; }
[data-dark] .theme .sun { display: block; }
.pick { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 16px; border-radius: 999px;
  border: 0; box-shadow: var(--lift); background: var(--card); color: var(--text); font-size: 15px; font-weight: 500; white-space: nowrap; }
.pick svg { color: var(--muted); }
@media (max-width: 389px) { .brand small { display: none; } }
@media (max-width: 409px) { .logo { display: none; } }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
[data-id="all"] .dot { background: var(--c-clinician); margin-right: 20px;
  box-shadow: 10px 0 var(--c-biohacker), 20px 0 var(--c-nutritionist); }
.menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 3; width: min(340px, calc(100vw - 32px));
  display: grid; gap: 2px; padding: 6px; background: var(--card); border-radius: 18px; box-shadow: var(--float); transform-origin: top right; }
.menu[hidden] { display: none; }
.opt { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-size: 13px; }
.opt .who { margin: 0; font-size: 15px; }
.opt[aria-pressed="true"] { background: var(--soft); }

.chat { flex: 1; }
.chat .wrap { display: grid; gap: 16px; padding-top: 24px; padding-bottom: 24px; }
.empty { color: var(--muted); padding: 8px 0; display: grid; gap: 14px; }
.empty p { margin: 0; }
.empty h2 { margin: 0; color: var(--text); font-size: clamp(28px, 7vw, 40px); font-weight: 500; letter-spacing: -.035em; line-height: 1.1; }
.empty .label { margin-top: 10px; font-size: 13px; font-weight: 500; }
.cards, .samples { display: grid; gap: 8px; }
.card { display: grid; gap: 2px; text-align: left; padding: 14px 16px; border-radius: 16px;
  border: 0; box-shadow: var(--lift); background: var(--card); color: var(--muted); font-size: 14px; }
.card .who { margin: 0; font-size: 15px; }
.say { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--c); color: var(--text); font-size: 14px; line-height: 1.45; }
.samples { display: flex; flex-wrap: wrap; }
.sample { font-size: 15px; color: var(--text); background: var(--soft); border: 0; border-radius: 22px;
  padding: 10px 16px; min-height: 44px; text-align: left; }
.q { justify-self: end; max-width: 85%; margin: 0; padding: 10px 16px; background: var(--soft);
  border-radius: var(--r) var(--r) 6px var(--r); overflow-wrap: anywhere; }
.a { margin: 0; padding: 16px 18px; background: var(--card); border-radius: var(--r); box-shadow: var(--lift); min-width: 0; }
.who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text); }
.sign { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--c);
  background: color-mix(in srgb, var(--c) 14%, transparent); }
[data-theme="dark"] .sign { background: color-mix(in srgb, var(--c) 24%, transparent); }
.sign.all { width: auto; background: none; display: flex; }
.sign.all i { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--card); }
.sign.all i + i { margin-left: -5px; }
.tag { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 2px 10px; }
.text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.src { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: var(--text); display: inline-block; padding: 12px 6px; margin: -12px -6px; }
.more { margin-top: 4px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--text); font-size: 14px; font-weight: 500;
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.stage { margin: 0 0 12px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.bar { height: 10px; border-radius: 6px; background: var(--soft); }
.bar + .bar { margin-top: 8px; width: 70%; }
.err { display: grid; gap: 8px; justify-items: start; color: var(--err); font-size: 15px; }
.err p { margin: 0; }
.retry { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 500; }

footer { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 14px);
  padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
form { display: flex; gap: 8px; align-items: flex-end; padding-top: 14px; }
.box { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 4px; padding: 6px; background: var(--card); border: 2px solid var(--accent); }
.to { flex: none; display: flex; align-items: center; gap: 4px; height: 44px; min-width: 44px; padding: 0 4px 0 12px;
  border: 0; background: none; color: var(--muted); }
.to[disabled] { cursor: default; }
.menu.up { position: fixed; top: auto; right: auto; bottom: calc(var(--foot, 80px) + 4px);
  left: max(calc(var(--side) + 16px), calc(50% + var(--side) / 2 - 344px)); transform-origin: bottom left; }
textarea { flex: 1; min-width: 0; font: inherit; color: var(--text); background: none; border: 0; outline: 0;
  padding: 10px 4px 10px 6px; min-height: 44px; max-height: 160px; resize: none; }
textarea:focus-visible { outline: 0; }
.send { flex: none; width: 44px; height: 44px; border-radius: 0; border: 0; background: var(--accent);
  color: var(--on-accent); display: grid; place-items: center; }
.send[disabled] { opacity: .3; cursor: default; }
@media (hover: hover) {
  .sample:hover { background: var(--hover); }
  .to:not([disabled]):hover { color: var(--text); }
  .pick:hover, .opt:hover { background: var(--soft); }
  .card:hover, .theme:hover, .icon:hover, .new:hover { box-shadow: var(--lift-hover); }
  .item:hover { background: var(--hover); }
  .del:hover, .plain:hover { color: var(--text); }
  .send:not([disabled]):hover, .retry:hover { background: var(--press); }
  .more:hover { text-decoration-color: currentColor; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  button, textarea { transition: background-color var(--t) var(--ease), color var(--t) var(--ease),
    opacity var(--t) var(--ease), transform var(--t) var(--ease); }
  button:not([disabled]):active { transform: scale(.96); transition-duration: .08s; }
  @media (hover: hover) { .card:not(:active):hover { transform: translateY(-2px); } }
  .pick svg { transition: transform var(--t) var(--ease); }
  body { transition: padding-left .25s var(--ease); }
  .side { transition: transform .25s var(--ease), width .25s var(--ease), visibility 0s .25s; }
  .side.open { transition: transform .25s var(--ease), visibility 0s; }
  .pick[aria-expanded="true"] svg { transform: rotate(180deg); }
  .menu:not([hidden]) { animation: drop .18s var(--ease) both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
  .dots i { animation: hop 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .bar { animation: glow 1.4s infinite ease-in-out; }
  .pending, .in { animation: rise .45s var(--ease) both; }
  .pending .sign { animation: breathe 1.6s infinite ease-in-out; }
  @keyframes breathe { 50% { transform: scale(1.1); opacity: .7; } }
  .send[aria-busy="true"] { opacity: 1; }
  .send[aria-busy="true"] svg { display: none; }
  .send[aria-busy="true"]::after { content: ""; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes hop { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes glow { 50% { opacity: .45; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  @keyframes spin { to { transform: rotate(360deg); } }
}
</style>
</head>
<body>

  <div class="side-top">
    <span class="side-brand"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='58' fill='%230a0a0a'/%3E%3Cg fill='%23aedf0c'%3E%3Cg id='s'%3E%3Cellipse cx='78' cy='91' rx='21' ry='15'/%3E%3Cellipse cx='62' cy='129' rx='21' ry='17' transform='rotate(-25 62 129)'/%3E%3Cellipse cx='81' cy='164' rx='21' ry='15'/%3E%3Cpath d='M72 100q-2 8-6 14M66 143q2 8 8 12' fill='none' stroke='%23aedf0c' stroke-width='11' stroke-linecap='round'/%3E%3C/g%3E%3Cuse href='%23s' transform='matrix(-1 0 0 1 254 0)'/%3E%3Cellipse cx='127' cy='75' rx='21' ry='15'/%3E%3Cellipse cx='127' cy='181' rx='21' ry='15'/%3E%3C/g%3E%3C/svg%3E" width="30" height="30" alt="">SAIN</span>
    <button class="plain close-side" type="button" id="closeSide" aria-label="Скрыть список чатов"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg></button>

</aside>
<div class="shade" id="shade" hidden></div>
<header id="head">
  <div class="wrap">
    <div class="lead">
    <button class="icon open-side" type="button" id="openSide" aria-label="Показать чаты" aria-expanded="false" aria-controls="side"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg></button>
    <h1 class="brand">
      <svg class="logo" width="34" height="34" viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" rx="58" fill="#0a0a0a"/><g fill="#aedf0c"><g id="s"><ellipse cx="78" cy="91" rx="21" ry="15"/><ellipse cx="62" cy="129" rx="21" ry="17" transform="rotate(-25 62 129)"/><ellipse cx="81" cy="164" rx="21" ry="15"/><path d="M72 100q-2 8-6 14M66 143q2 8 8 12" fill="none" stroke="#aedf0c" stroke-width="11" stroke-linecap="round"/></g><use href="#s" transform="matrix(-1 0 0 1 254 0)"/><ellipse cx="127" cy="75" rx="21" ry="15"/><ellipse cx="127" cy="181" rx="21" ry="15"/></g></svg>
      <span>SAIN<small>эксперты по сну</small></span>
    </h1>
    </div>
    <div class="tools">
    <button class="theme" type="button" id="theme" aria-label="Тёмная тема">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>

      </button>
      <div class="menu" id="menu" hidden></div>
    </div>
    </div>

</header>

<main class="chat">
  <div class="wrap" id="log" aria-live="polite">
    <div class="empty" id="empty">
      <h2>Спросите о сне трёх экспертов</h2>

<script>
const $ = (id) => document.getElementById(id);
const SHORT = { clinician: "Клиницист", biohacker: "Биохакер", nutritionist: "Нутрициолог" };
const TO = { all: "всем троим", clinician: "клиницисту", biohacker: "биохакеру", nutritionist: "нутрициологу" };
const SAMPLES = [
  "Пью кофе в пять вечера, это мешает уснуть?",
  "В спальне жарко. Это влияет на сон?",
  "Тренируюсь вечером. Это мешает уснуть?",
];
const STAGES = [[1500, "ищет статью"], [4000, "пишет ответ"]];
const motion = matchMedia("(prefers-reduced-motion: no-preference)").matches;
const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
const STAND = "https://team01.hack.be-healthy.tech";
const mouse = matchMedia("(pointer: fine)").matches;
let base = "";
const experts = {};
let current = "all";
let failed = [];
const KEY = "sain-chats";
const emptyNode = $("empty");
const wide = matchMedia("(min-width: 1000px)");
const fresh = () => ({ title: "", at: Date.now(), turns: [] });
let chats = [];
let chat = null;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
async function api(path, body) {
  let res;
  try {
    const init = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
    res = await fetch(base + path, { ...init, signal: AbortSignal.timeout(90000) });
  } catch (err) {
    throw new Error(err.name === "TimeoutError" ? "сервер не ответил вовремя" : "нет связи с сервером");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "сервер временно недоступен"), { status: res.status });
  return data;
}
function name(id) {
  return id === "all" ? "Все трое" : experts[id]?.name || id;
}
let opener = null;
function menu(open, from = $("pick")) {
  if (open) opener = from;
  for (const b of [$("pick"), $("to")]) b.setAttribute("aria-expanded", String(open && b === from));
  $("menu").classList.toggle("up", open && from === $("to"));
  $("menu").hidden = !open;
}
function select(id) {
  current = id;
  for (const b of $("menu").children) b.setAttribute("aria-pressed", String(b.dataset.id === id));
  $("pick").dataset.id = id;
  $("pick").style.setProperty("--c", `var(--c-${id})`);
  $("to").dataset.id = id;
  $("to").style.setProperty("--c", `var(--c-${id})`);
  $("pick-name").textContent = SHORT[id] || name(id);
  $("text").placeholder = `Вопрос ${TO[id] || name(id)}`;
}
function pick(id) {
  select(id);
  if (mouse) $("text").focus();
}
async function loadExperts() {
  try {
    let list = await api("/experts").then((d) => d.experts).catch(() => null);
    if (!list) {
      base = STAND;
      list = (await api("/experts")).experts;
    }
    list.forEach((e) => (experts[e.expert_id] = e));
    $("menu").replaceChildren(...["all", ...list.map((e) => e.expert_id)].map((id) => {
      const b = el("button", "opt", id === "all" ? "Один вопрос, три разных ответа" : experts[id].tagline);
      b.type = "button";
      b.dataset.id = id;
      b.style.setProperty("--c", `var(--c-${id})`);
      b.prepend(who(id, "span", name(id)));
      b.onclick = () => {
        select(id);
        menu(false);
        opener.focus();
      };
      return b;
    }));
    $("pick").disabled = false;
    $("to").disabled = false;
    $("cards").replaceChildren(...list.map((e) => {
      const b = el("button", "card", e.tagline);
      b.type = "button";
      b.style.setProperty("--c", `var(--c-${e.expert_id})`);
      b.prepend(who(e.expert_id, "span", e.name));
      if (e.sample) b.append(el("span", "say", `«${e.sample}»`));
      b.onclick = () => pick(e.expert_id);
      return b;
    }));
    $("sayLabel").hidden = !list.some((e) => e.sample);
    select("all");
    $("send").disabled = false;
  } catch (err) {
    $("cards").replaceChildren(el("p", "err", `Эксперты не загрузились: ${err.message}. Обновите страницу.`));
  }
}
const ICONS = {
  clinician: '<path d="M3 12h4l2-5 4 10 2-5h6"/>',
  biohacker: '<path d="M4 4v16h16"/><path d="m8 15 3-4 3 2 5-6"/>',
  nutritionist: '<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="m5 19 8-8"/>',
};
function who(id, tag, text) {
  const n = el(tag, "who");
  const s = el("span", id === "all" ? "sign all" : "sign");
  s.setAttribute("aria-hidden", "true");
  if (id === "all") for (const e of Object.keys(ICONS)) s.append(Object.assign(el("i"), { style: `--c: var(--c-${e})` }));
  else s.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[id] || ""}</svg>`;
  n.append(s, text);
  return n;
}
function card(id) {
  const box = el("article", "a");
  box.style.setProperty("--c", `var(--c-${id})`);
  box.append(who(id, "div", name(id)));
  return box;
}
function pending(id) {
  const box = card(id);
  box.classList.add("pending");
  box.setAttribute("aria-hidden", "true");
  const stage = el("p", "stage", "читает вопрос");
  const dots = el("span", "dots");
  dots.append(el("i"), el("i"), el("i"));
  stage.append(dots);
  box.append(stage, el("div", "bar"), el("div", "bar"));
  return box;
}
function answer(a, turn, animate) {
  const box = card(a.expert_id);
  if (animate) box.classList.add("in");
  if (turn.refused) box.firstChild.append(el("span", "tag", "вне компетенции"));
  else if (turn.simple) box.firstChild.append(el("span", "tag", "упрощённый ответ"));
  box.append(el("p", "text", a.text));
  if (turn.cite) box.append(source(turn.cite));
  if (turn.asked === "all") {
    const more = el("button", "more", "Спросить дальше");
    more.type = "button";
    more.setAttribute("aria-label", `Продолжить разговор: ${name(a.expert_id)}`);
    more.onclick = () => pick(a.expert_id);
    box.append(more);
  }
  return box;
}
async function type(box) {
  const p = box.querySelector(".text");
  const after = [...box.children].filter((n) => n.matches(".src, .more"));
  const words = p.textContent.split(/(?<=\s)/);
  const step = Math.ceil(words.length / 60);
  after.forEach((n) => (n.hidden = true));
  box.setAttribute("aria-busy", "true");
  p.textContent = "";
  for (let i = 0; i < words.length; i += step) {
    p.textContent += words.slice(i, i + step).join("");
    await sleep(32);
  }
  box.removeAttribute("aria-busy");
  after.forEach((n) => (n.hidden = false));
}
function source(c) {
  const where = [c.article_title || c.article_id, c.section_title && `раздел «${c.section_title}»`, c.year].filter(Boolean);
  const src = el("p", "src", `Источник: ${where.join(", ")}`);
  if (c.doi) {
    const link = el("a", "", "DOI");
    link.href = `https://doi.org/${c.doi}`;
    link.target = "_blank";
    link.rel = "noopener";
    src.append(" · ", link);
  }
  return src;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(chats.filter((c) => c.turns.length).slice(0, 50))); } catch (e) {}
}
function drawList() {
  let last = "";
  $("list").replaceChildren(...chats.filter((c) => c.turns.length).flatMap((c) => {
    const group = when(c.at || Date.now());
    const item = el("div", "item");
    const open = el("button", "open", c.title);
    open.type = "button";
    open.title = c.title;
    open.setAttribute("aria-current", String(c === chat));
    open.onclick = () => { openChat(c); side(false); };
    const del = el("button", "del");
    del.type = "button";
    del.setAttribute("aria-label", `Удалить чат «${c.title}»`);
    del.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
    del.onclick = () => remove(c);
    item.append(open, del);
    if (group === last) return [item];
    last = group;
    return [el("p", "when", group), item];
  }));
}
function when(at) {
  const day = (t) => new Date(t).setHours(0, 0, 0, 0);
  const days = (day(Date.now()) - day(at)) / 864e5;
  if (days < 1) return "Сегодня";
  if (days < 2) return "Вчера";
  if (days < 7) return "7 дней";
  if (days < 30) return "30 дней";
  const m = new Date(at).toLocaleDateString("ru", { month: "long" });
  return `${m[0].toUpperCase()}${m.slice(1)} ${new Date(at).getFullYear()}`;
}
function fold() {
  const on = document.documentElement.classList.toggle("folded");
  $("closeSide").setAttribute("aria-label", on ? "Показать список чатов" : "Скрыть список чатов");
}
const busyNow = () => $("send").getAttribute("aria-busy") === "true";
function openChat(c) {
  if (busyNow()) return;
  chat = c;
  chats = chats.filter((x) => x.turns.length || x === c);
  failed = [];
  $("log").replaceChildren(...(c.turns.length ? c.turns.flatMap((t) => [el("p", "q", t.q), ...t.answers.map((a) => answer(a, t, false))]) : [emptyNode]));
  drawList();
  scrollTo(0, c.turns.length ? document.documentElement.scrollHeight : 0);
}
function newChat() {
  if (chat.turns.length) {
    chats.unshift(fresh());
    openChat(chats[0]);
    select("all");
  }
  side(false);
  if (mouse) $("text").focus();
}
function remove(c) {
  if (busyNow()) return;
  chats = chats.filter((x) => x !== c);
  save();
  if (c !== chat) return drawList();
  chats.unshift(fresh());
  openChat(chats[0]);
}
function side(open) {
  if (wide.matches) return;
  $("side").classList.toggle("open", open);
  $("shade").hidden = !open;
  $("openSide").setAttribute("aria-expanded", String(open));
  for (const n of document.querySelectorAll("header, main, footer")) n.inert = open;
  if (open) $("new").focus();
  else if ($("side").contains(document.activeElement)) $("openSide").focus();
}
function busy(on) {
  $("send").disabled = on;
  $("send").setAttribute("aria-busy", String(on));
}
async function ask(text) {
  const c = chat;
  emptyNode.remove();
  failed.forEach((n) => n.remove());
  failed = [];
  const asked = current;
  const q = el("p", "q", text);
  const slots = Object.fromEntries((asked === "all" ? Object.keys(experts) : [asked]).map((id) => [id, pending(id)]));
  $("log").append(q, ...Object.values(slots));
  q.scrollIntoView({ block: "start", behavior: motion ? "smooth" : "auto" });
  busy(true);
  const timers = STAGES.map(([ms, label]) => setTimeout(() => {
    for (const s of Object.values(slots)) s.querySelector(".stage").firstChild.textContent = label;
  }, ms));
  try {
    const sent = c.turns.flatMap((t) => [{ role: "user", text: t.q }, { role: "assistant", text: (t.answers.find((a) => a.expert_id === asked) || t.answers[0]).text }]);
    const body = { expert_id: asked, text, history: sent, article: c.turns.at(-1)?.cite?.article_id || "" };
    const data = await api("/ask", body).catch(async (err) => {
      if (err.status !== 429) throw err;
      return { ...(await api("/ask", { ...body, fake: true })), demo: true };
    });
    const answers = (data.answers || [{ expert_id: data.expert_id, text: data.text }]).map(({ expert_id, text }) => ({ expert_id, text }));
    const turn = { q: text, asked, refused: !!data.refused, simple: !!(data.demo || data.degraded), cite: data.citations[0] || null, answers };
    c.turns.push(turn);
    c.title ||= text.slice(0, 80);
    c.at = Date.now();
    chats = [c, ...chats.filter((x) => x !== c)];
    save();
    drawList();
    await Promise.all(answers.map(async (a, i) => {
      if (motion) await sleep(i * 400);
      const box = answer(a, turn, motion);
      slots[a.expert_id].replaceWith(box);
      if (motion) await type(box);
    }));
  } catch (err) {
    Object.values(slots).forEach((s) => s.remove());
    const box = el("div", "err");
    const retry = el("button", "retry", "Повторить");
    retry.type = "button";
    retry.onclick = () => {
      if ($("send").disabled) return;
      if ($("text").value === text) $("text").value = "";
      grow();
      ask(text);
    };
    failed = [q, box];
    box.append(el("p", "", `Ответа нет: ${err.message}. Вопрос вернул в поле.`), retry);
    q.after(box);
    if (!$("text").value) $("text").value = text;
    grow();
  } finally {
    timers.forEach(clearTimeout);
    busy(false);
  }
}
function grow() {
  const t = $("text");
  const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 8;
  t.style.height = "auto";
  t.style.height = `${Math.min(t.scrollHeight + 2, 160)}px`;
  if (atBottom) scrollTo(0, document.documentElement.scrollHeight);
}
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if ($("send").disabled) return;
  if (!text) { $("text").focus(); return; }
  $("text").value = "";
  grow();
  ask(text);
});
$("text").addEventListener("input", grow);
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
for (const q of SAMPLES) {
  const b = el("button", "sample", q);
  b.type = "button";
  b.onclick = () => { $("text").value = q; grow(); if (mouse) $("text").focus(); };
  $("samples").append(b);
}
$("pick").onclick = () => menu($("menu").hidden);
$("to").onclick = () => menu($("menu").hidden, $("to"));
document.addEventListener("click", (e) => {
  if (!$("picker").contains(e.target) && !$("to").contains(e.target)) menu(false);
});
$("new").onclick = newChat;
$("openSide").onclick = () => side(true);
$("closeSide").onclick = () => (wide.matches ? fold() : side(false));
$("shade").onclick = () => side(false);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("side").classList.contains("open")) side(false);
  if (e.key === "Escape" && !$("menu").hidden) {
    menu(false);
    opener.focus();
  }
});
new ResizeObserver(() => {
  document.documentElement.style.scrollPaddingTop = `${$("head").offsetHeight + 12}px`;
}).observe($("head"));
new ResizeObserver(() => {
  document.documentElement.style.setProperty("--foot", `${document.querySelector("footer").offsetHeight}px`);
}).observe(document.querySelector("footer"));
function paint() {
  const on = document.documentElement.dataset.theme === "dark";
  document.body.toggleAttribute("data-dark", on);
  $("theme").setAttribute("aria-label", on ? "Светлая тема" : "Тёмная тема");
}
$("theme").onclick = () => {
  const next = document.body.hasAttribute("data-dark") ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  paint();
};
paint();
try { chats = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
chats.unshift(fresh());
chat = chats[0];
drawList();
loadExperts();
</script>
</body>
</html>
